version: "3.8"

services:
  project-management:
    build:
      context: ..
    ports:
      - "3000:3000"
    command: node apps/project-management/dist/index
    environment:
      NODE_ENV: production

  payroll:
    build:
      context: ..
    ports:
      - "3001:3000"
    command: node apps/payroll/dist/index
    environment:
      NODE_ENV: production
