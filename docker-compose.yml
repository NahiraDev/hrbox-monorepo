  version: '3.8'
  services:
    app:
      build: configs
      ports:
        - "3000:3000"
      volumes:
        - .:/app
        - /app/node_modules
      environment:
        - NODE_ENV=development
      command: pnpm dev
    redis:
      image: redis:alpine
      ports:
        - "6379:6379"
