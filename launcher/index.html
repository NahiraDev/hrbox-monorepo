<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/ico" href="/images/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="modulepreload" href="/launcher/main.tsx" as="script" type="module" />

  <title>HRBox</title>
  <meta key="title" content="HRBox" property="og:title" />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet"
  />
  <meta
    content="Make beautiful websites regardless of your design experience."
    property="og:description"
  />
  <meta
    content="Make beautiful websites regardless of your design experience."
    name="description"
  />
  <meta
    key="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    name="viewport"
  />
</head>
<body>
<div id="loading" class="loading-container">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading HR Box...</div>
  <div class="loading-subtext">Initializing modules and services</div>
</div>
<div id="root"></div>
<script type="module" src="main.tsx"></script>

<script type="module">
  // Hide loading screen once app is ready
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 300);
      }
    }, 1000);
  });
</script>

</body>
</html>
